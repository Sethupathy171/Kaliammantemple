<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>பூஜைகள் - காளியம்மன் கோவில்</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil&display=swap" rel="stylesheet">

<style>

/* 🌈 Body */
body {
    margin: 0;
    font-family: 'Noto Serif Tamil', serif;
    background: linear-gradient(to right, #fff5e6, #ffe6e6);
}

/* 🔥 Header */
header {
    background: linear-gradient(45deg, #8B0000, #FF4500);
    color: white;
    text-align: center;
    padding: 20px;
    position: relative;
}

/* 🌐 Toggle */
.lang-btn {
    position: absolute;
    top: 15px;
    right: 20px;
}
.lang-btn button {
    background: gold;
    border: none;
    padding: 6px 12px;
    margin: 3px;
    border-radius: 20px;
    cursor: pointer;
}

/* 🔗 Navbar */
nav a {
    color: white;
    margin: 10px;
    text-decoration: none;
    font-weight: bold;
}

/* 📦 Section */
.section {
    max-width: 1100px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

/* 🏷 Title */
.section h2 {
    text-align: center;
    color: maroon;
}

/* 🧱 Cards */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 15px;
}

.card {
    background: #f9f9f9;
    padding: 15px;
    border-radius: 12px;
    border-left: 5px solid #8B0000;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

/* 📱 Mobile */
@media(max-width:768px){
    .section { margin: 15px; }
}

</style>
</head>

<body>

<header>

<h1 data-ta="அருள்மிகு ஸ்ரீ காளியம்மன் திருக்கோவில்"

<button onclick="setLang('en')">English</button>

</nav>

<div class="section">

<h2 data-ta="🙏 வழக்கமான பூஜைகள்"
data-en="🙏 Regular Poojas">
🙏 வழக்கமான பூஜைகள்
</h2>

<div class="grid">

<div class="card"
data-ta="ஆடி திருவிழா – ஆடி மாதம் முழுவதும் வெள்ளிக்கிழமை சிறப்பு பூஜைகள் மற்றும் அன்னதானம் நடைபெறும்."
data-en="Aadi Festival – Special poojas throughout Aadi month Friday.">
ஆடி திருவிழா
</div>

<div class="card"
data-ta="அமாவாசை – அபிஷேக அலங்கார பூஜை நடைபெறும். "
data-en="Amavasai – Abhishekam and Alangara pooja">
அமாவாசை
</div>

<div class="card"
data-ta="பௌர்ணமி – அபிஷேக அலங்கார பூஜை நடைபெறும்."
data-en="Pournami – Abhishekam and Alangara pooja.">
பௌர்ணமி
</div>

<div class="card"
data-ta="ஆடி திருக்கல்யாணம் – அம்மன் திருக்கல்யாண வைபோகம்."
data-en="Aadi Thirukalyanam – Divine wedding ceremony.">
ஆடி திருக்கல்யாணம்
</div>

<div class="card"
data-ta="சங்கடஹர சதுர்த்தி – விநாயகர் சிறப்பு அபிஷேக அலங்கார பூஜை நடைபெறும்."
data-en="Sankadahara Chathurthi – Special Abhishekam and Alangara pooja for Lord Ganesha.">
சங்கடஹர சதுர்த்தி
</div>

<div class="card"
data-ta="கிருத்திகை – முருகன் வழிபாடு மற்றும் தீபம்."
data-en="Krithigai – Special Abhishekam and Alangara pooja for Lord Murugan.">
கிருத்திகை
</div>

<div class="card"
data-ta="நவராத்திரி – 9 நாள் அம்மன் பூஜைகள்."
data-en="Navaratri – 9 days of goddess worship.">
நவராத்திரி
</div>

<div class="card"
data-ta="பொங்கல் – சிறப்பு வழிபாடு மற்றும் அன்னதானம்."
data-en="Pongal – Special pooja and annadhanam.">
பொங்கல்
</div>

</div>

</div>

<script>
function setLang(lang){
document.querySelectorAll("[data-ta]").forEach(el=>{
el.innerHTML = el.getAttribute("data-"+lang);
});
localStorage.setItem("lang",lang);
}
window.onload=function(){
let lang=localStorage.getItem("lang")||"ta";
setLang(lang);
}
</script>

</body>
</html>
